[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deployment-plan"
version = "0.1.0"
description = "Carry deployment obligations from pull requests through every release"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Gigaverse"}]
dependencies = ["pydantic>=2.11,<3", "pyyaml>=6,<7", "httpx>=0.28,<1"]
keywords = ["deployment", "release", "runbook", "github", "checklist"]
classifiers = ["Intended Audience :: Developers", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.scripts]
deployment-plan = "deployment_plan.cli:main"

[project.urls]
Homepage = "https://github.com/gigaverse-app/deployment-plan"
Documentation = "https://gigaverse-app.github.io/deployment-plan/"
Repository = "https://github.com/gigaverse-app/deployment-plan"
Issues = "https://github.com/gigaverse-app/deployment-plan/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "build>=1.2", "twine>=6", "respx>=0.22", "mkdocs-material>=9.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/deployment_plan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["no_db: standalone tests requiring no database"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
