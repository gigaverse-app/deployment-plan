name: Release Please

# Release PRs accumulate changes; merging one is the publishing decision.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release-automation
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Only process the tested main head
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            core.setOutput('matches', branch.commit.sha === context.payload.workflow_run.head_sha);
      - name: Require release bot authentication
        if: steps.current.outputs.matches == 'true'
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.GV_CI_CROSS_REPO_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_TOKEN" != "true" ]]; then
            echo "::error::Share the organization GV_CI_CROSS_REPO_TOKEN secret with this repository."
            exit 1
          fi
      - name: Prepare release PR or publish its GitHub release
        if: steps.current.outputs.matches == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # This credential triggers CI on release PRs and Publish on releases.
          # GITHUB_TOKEN would suppress those follow-up workflow events.
          token: ${{ secrets.GV_CI_CROSS_REPO_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
