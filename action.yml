name: Deployment plan
description: Review deployment actions, carry unfinished work forward, and record completion per environment
author: Gigaverse
branding:
  icon: check-square
  color: blue
inputs:
  token:
    description: GitHub token with contents read and pull-requests write permissions
    required: true
  manifest:
    description: Manifest directory or legacy ledger path in the consumer repository
    default: deployment/followups
  environments:
    description: JSON mapping of promotion branch names to environment names
    default: '{"staging":"staging","production":"production"}'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install this exact trusted action revision
      shell: bash
      env:
        TOOL_SOURCE: ${{ github.action_path }}
      run: python -m pip install "$TOOL_SOURCE"
    - name: Reconcile deployment plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DEPLOYMENT_PLAN_MANIFEST: ${{ inputs.manifest }}
        DEPLOYMENT_PLAN_ENVIRONMENTS: ${{ inputs.environments }}
      run: python -m deployment_plan.automation
